version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casino_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=casino
      - DB_USERNAME=casino_user
      - DB_PASSWORD=casino_pass
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - casino_network

  db:
    image: mysql:8.0
    container_name: casino_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: casino
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_PASSWORD: casino_pass
      MYSQL_USER: casino_user
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - casino_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: casino_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: casino_user
      PMA_PASSWORD: casino_pass
      PMA_ROOT_PASSWORD: root_pass
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - casino_network

volumes:
  dbdata:
    driver: local

networks:
  casino_network:
    driver: bridge
