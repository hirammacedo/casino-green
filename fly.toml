app = "casino-green"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "GREEN"
  APP_ENV = "production"
  APP_KEY = "base64:abcdefghijklmnopqrstuvwxyz1234567890="
  APP_DEBUG = "false"
  APP_TIMEZONE = "UTC"
  APP_URL = "https://casino-green.fly.dev"
  LOG_CHANNEL = "stack"
  DB_CONNECTION = "mysql"

# [deploy]
#   release_command = "echo 'Database migrations skipped - configure DB_HOST to run migrations'"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  
  [services.concurrency]
    hard_limit = 20
    soft_limit = 17
    
  [[services.ports]]
    handlers = ["http"]
    port = 80
    
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
